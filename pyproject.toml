[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# F  pyflakes (unused imports, undefined names)
# E/W pycodestyle
# I  import sorting
# UP pyupgrade
# B  bugbear
# SIM flake8-simplify
# RUF ruff-specific
select = ["F", "E", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Delivery policies share one signature so they are interchangeable in
# DELIVERY_POLICIES; two of them legitimately ignore `rng`.
"simulation.py" = ["ARG001"]
